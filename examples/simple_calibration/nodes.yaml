# Simple calibration example — Grippe vs. Angine
#
# Two diseases and three symptoms.  Only the nodes are defined here;
# the coupling matrices are computed by the calibration system.

nodes:

# ── Symptom nodes ──────────────────────────────────────────────

  - name: temperature
    family:
      type: gaussian
      mu: 37.0        # population mean °C
      sigma2: 0.25    # σ=0.5°C
    tau: 7.0

  - name: headache
    family:
      type: beta
      alpha: 1.5
      beta: 13.5      # mean=0.10, strength=15
    tau: 3.0

  - name: sore_throat
    family:
      type: beta
      alpha: 1.0
      beta: 19.0      # mean=0.05, strength=20
    tau: 5.0

# ── Disease nodes ──────────────────────────────────────────────

  - name: flu
    family:
      type: beta
      alpha: 6.0      # mean=0.15, strength=40
      beta: 34.0
    tau: 14.0

  - name: tonsillitis
    family:
      type: beta
      alpha: 2.0      # mean=0.10, strength=20
      beta: 18.0
    tau: 10.0
