# Grippe vs. Angine — node definitions
#
# Clinical variables (symptoms) and disease variables
# shared across all patients.

nodes:
  # -- Clinical variables (symptoms) --
  - name: "temperature"
    family:
      type: gaussian
      mu: 37.0
      sigma2: 0.25
    tau: 7.0

  - name: "headache"
    family:
      type: bernoulli
      p: 0.1
    tau: 3.0

  - name: "sore_throat"
    family:
      type: bernoulli
      p: 0.05
    tau: 5.0

  - name: "body_aches"
    family:
      type: bernoulli
      p: 0.05
    tau: 3.0

  # -- Disease variables --
  # Priors reflect clinical setting: patients presenting with symptoms
  # have higher a priori disease probability than the general population.
  - name: "flu"
    family:
      type: bernoulli
      p: 0.25
    tau: 14.0

  - name: "tonsillitis"
    family:
      type: bernoulli
      p: 0.25
    tau: 10.0
