# Grippe vs. Angine — node definitions
#
# CALIBRATION NOTES:
#
# Symptom priors are weak (strength ≈ 10–20) — a single observation
# (κ=20) dominates.
#
# Disease priors use moderate strength (α+β = 10) to resist
# oscillation in the undirected MRF feedback loops, while still
# being movable by strong symptom evidence via coupling.
#
# Coupling values in 0.15–0.25 for Beta↔Beta, ~0.005 for
# Beta↔Gaussian (temperature).

nodes:
  # ── Symptom nodes ──────────────────────────────────────────────

  - name: "temperature"
    family:
      type: gaussian
      mu: 37.0        # normal body temperature
      sigma2: 0.25    # prior σ = 0.5°C
    tau: 7.0

  - name: "headache"
    family:
      type: beta
      alpha: 1.0
      beta: 9.0        # mean=0.10, strength=10
    tau: 3.0

  - name: "sore_throat"
    family:
      type: beta
      alpha: 1.0
      beta: 19.0       # mean=0.05, strength=20
    tau: 5.0

  - name: "body_aches"
    family:
      type: beta
      alpha: 1.0
      beta: 19.0       # mean=0.05, strength=20
    tau: 3.0

  # ── Disease nodes ──────────────────────────────────────────────

  - name: "flu"
    family:
      type: beta
      alpha: 2.5       # mean=0.25, strength=10
      beta: 7.5        # moderate strength resists oscillation
    tau: 14.0
    coupled_with:
      - node: temperature
        coupling:
          - [0.005, 0.0]
          - [0.0, 0.0]
      - node: headache
        coupling:
          - [0.25, 0.0]
          - [0.0, 0.0]
      - node: body_aches
        coupling:
          - [0.25, 0.0]
          - [0.0, 0.0]
      - node: tonsillitis
        coupling:
          - [-0.10, 0.0]
          - [0.0, 0.0]

  - name: "tonsillitis"
    family:
      type: beta
      alpha: 2.5       # mean=0.25, strength=10
      beta: 7.5        # moderate strength resists oscillation
    tau: 10.0
    coupled_with:
      - node: temperature
        coupling:
          - [0.004, 0.0]
          - [0.0, 0.0]
      - node: sore_throat
        coupling:
          - [0.25, 0.0]
          - [0.0, 0.0]
      - node: headache
        coupling:
          - [0.10, 0.0]
          - [0.0, 0.0]
