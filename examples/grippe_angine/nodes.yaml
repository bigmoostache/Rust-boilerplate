# Grippe vs. Angine — node definitions
#
# Clinical variables (symptoms) and disease variables
# shared across all patients.
#
# Disease→symptom edges are declared inline on disease nodes.
# This keeps the causal structure visible next to the disease definition.

nodes:
  # -- Clinical variables (symptoms) --
  - name: "temperature"
    family:
      type: gaussian
      mu: 37.0
      sigma2: 0.25
    tau: 7.0

  - name: "headache"
    family:
      type: bernoulli
      p: 0.1
    tau: 3.0

  - name: "sore_throat"
    family:
      type: bernoulli
      p: 0.05
    tau: 5.0

  - name: "body_aches"
    family:
      type: bernoulli
      p: 0.05
    tau: 3.0

  # -- Disease variables --
  # Priors reflect clinical setting: patients presenting with symptoms
  # have higher a priori disease probability than the general population.

  - name: "flu"
    family:
      type: bernoulli
      p: 0.25
    tau: 14.0
    coupled_with:
      # flu → temperature (1×2): moderate-to-high fever
      - node: temperature
        coupling: [[0.01, 0.0]]
      # flu → headache (1×1): common with flu
      - node: headache
        coupling: [[1.5]]
      # flu → body_aches (1×1): hallmark symptom
      - node: body_aches
        coupling: [[2.0]]
      # flu ↔ tonsillitis (1×1): soft mutual exclusion
      - node: tonsillitis
        coupling: [[-0.3]]

  - name: "tonsillitis"
    family:
      type: bernoulli
      p: 0.25
    tau: 10.0
    coupled_with:
      # tonsillitis → temperature (1×2): mild-to-moderate fever
      - node: temperature
        coupling: [[0.008, 0.0]]
      # tonsillitis → sore_throat (1×1): hallmark symptom
      - node: sore_throat
        coupling: [[2.5]]
      # tonsillitis → headache (1×1): mild referred pain
      - node: headache
        coupling: [[0.5]]
