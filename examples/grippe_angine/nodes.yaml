# Grippe vs. Angine — node definitions
#
# Clinical variables (symptoms) and disease variables
# shared across all patients.
#
# Disease→symptom edges are declared inline on disease nodes.
# This keeps the causal structure visible next to the disease definition.

nodes:
  # -- Clinical variables (symptoms) --
  - name: "temperature"
    family:
      type: gaussian
      mu: 37.0
      sigma2: 0.25
    tau: 7.0

  - name: "headache"
    family:
      type: beta
      alpha: 1.0
      beta: 9.0
    tau: 3.0

  - name: "sore_throat"
    family:
      type: beta
      alpha: 1.0
      beta: 19.0
    tau: 5.0

  - name: "body_aches"
    family:
      type: beta
      alpha: 1.0
      beta: 19.0
    tau: 3.0

  # -- Disease variables --
  # Priors reflect clinical setting: patients presenting with symptoms
  # have higher a priori disease probability than the general population.

  - name: "flu"
    family:
      type: beta
      alpha: 2.5
      beta: 7.5
    tau: 14.0
    coupled_with:
      # flu → temperature (2×2): moderate-to-high fever
      # Small coupling: Beta E[T] ≈ (-3, -0.1) vs Gaussian E[T] ≈ (37, 1370)
      - node: temperature
        coupling:
          - [0.005, 0.0]
          - [0.0, 0.0]
      # flu → headache (2×2): common with flu
      - node: headache
        coupling:
          - [0.15, 0.0]
          - [0.0, 0.0]
      # flu → body_aches (2×2): hallmark symptom
      - node: body_aches
        coupling:
          - [0.2, 0.0]
          - [0.0, 0.0]
      # flu ↔ tonsillitis (2×2): soft mutual exclusion
      - node: tonsillitis
        coupling:
          - [-0.05, 0.0]
          - [0.0, 0.0]

  - name: "tonsillitis"
    family:
      type: beta
      alpha: 2.5
      beta: 7.5
    tau: 10.0
    coupled_with:
      # tonsillitis → temperature (2×2): mild-to-moderate fever
      - node: temperature
        coupling:
          - [0.004, 0.0]
          - [0.0, 0.0]
      # tonsillitis → sore_throat (2×2): hallmark symptom
      - node: sore_throat
        coupling:
          - [0.25, 0.0]
          - [0.0, 0.0]
      # tonsillitis → headache (2×2): mild referred pain
      - node: headache
        coupling:
          - [0.05, 0.0]
          - [0.0, 0.0]
