# Run: cargo run -- infer -i examples/grippe_angine/patient_input.yaml
#
# Grippe vs. Angine differential diagnosis (single-file version)
#
# A patient presents with fever, sore throat, and headache.
# The model should differentiate between flu (grippe) and
# tonsillitis (angine) based on symptom patterns.
#
# Key clinical insight:
#   - Flu → headache + body aches (systemic)
#   - Tonsillitis → sore throat (localised)
#   - Patient has NO body aches → less likely flu

nodes:
  # -- Clinical variables (symptoms) --
  - name: "temperature"
    family:
      type: gaussian
      mu: 37.0
      sigma2: 0.25
    tau: 7.0

  - name: "headache"
    family:
      type: bernoulli
      p: 0.1
    tau: 3.0

  - name: "sore_throat"
    family:
      type: bernoulli
      p: 0.05
    tau: 5.0

  - name: "body_aches"
    family:
      type: bernoulli
      p: 0.05
    tau: 3.0

  # -- Disease variables --
  # Priors reflect clinical setting: patients presenting with symptoms
  # have higher a priori disease probability than the general population.
  - name: "flu"
    family:
      type: bernoulli
      p: 0.25
    tau: 14.0

  - name: "tonsillitis"
    family:
      type: bernoulli
      p: 0.25
    tau: 10.0

edges:
  # Flu → symptoms
  - from: flu
    to: temperature
    coupling:
      - [0.01, 0.0]

  - from: flu
    to: headache
    coupling:
      - [1.5]

  - from: flu
    to: body_aches
    coupling:
      - [2.0]

  # Tonsillitis → symptoms
  - from: tonsillitis
    to: temperature
    coupling:
      - [0.008, 0.0]

  - from: tonsillitis
    to: sore_throat
    coupling:
      - [2.5]

  - from: tonsillitis
    to: headache
    coupling:
      - [0.5]

  # Disease competition
  - from: flu
    to: tonsillitis
    coupling:
      - [-0.3]

observations:
  # Patient presents with:
  # - High fever: 39.2°C (measured with thermometer, low noise)
  - type: gaussian_noise
    node: temperature
    value: 39.2
    noise_var: 0.04

  # - Sore throat: yes
  - type: bernoulli_exact
    node: sore_throat
    value: true

  # - Headache: yes
  - type: bernoulli_exact
    node: headache
    value: true

  # - Body aches: NO — this is the key differentiator!
  - type: bernoulli_exact
    node: body_aches
    value: false

inference:
  max_iter: 500
  tolerance: 1.0e-10
  delta_t: 0.0
