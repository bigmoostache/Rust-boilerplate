# Run: cargo run -- infer -i examples/grippe_angine/patient_input.yaml
#
# Grippe vs. Angine differential diagnosis (single-file version)
#
# A patient presents with fever, sore throat, and headache.
# The model should differentiate between flu (grippe) and
# tonsillitis (angine) based on symptom patterns.
#
# Key clinical insight:
#   - Flu → headache + body aches (systemic)
#   - Tonsillitis → sore throat (localised)
#   - Patient has NO body aches → less likely flu
#
# All binary variables use Beta distributions — the pseudo-count
# (α + β) encodes uncertainty on the probability p = α/(α+β).
# Binary observations use proportion values:
#   0.999 = symptom present (near-certain)
#   0.001 = symptom absent (near-certain)

nodes:
  # -- Clinical variables (symptoms) --
  - name: "temperature"
    family:
      type: gaussian
      mu: 37.0
      sigma2: 0.25
    tau: 7.0

  - name: "headache"
    family:
      type: beta
      alpha: 1.0
      beta: 9.0
    tau: 3.0

  - name: "sore_throat"
    family:
      type: beta
      alpha: 1.0
      beta: 19.0
    tau: 5.0

  - name: "body_aches"
    family:
      type: beta
      alpha: 1.0
      beta: 19.0
    tau: 3.0

  # -- Disease variables --
  # Priors reflect clinical setting: patients presenting with symptoms
  # have higher a priori disease probability than the general population.
  - name: "flu"
    family:
      type: beta
      alpha: 2.5
      beta: 7.5
    tau: 14.0

  - name: "tonsillitis"
    family:
      type: beta
      alpha: 2.5
      beta: 7.5
    tau: 10.0

edges:
  # Flu → symptoms (2×2 couplings, only top-left entry active)
  - node_a: flu
    node_b: temperature
    coupling:
      - [0.005, 0.0]
      - [0.0, 0.0]

  - node_a: flu
    node_b: headache
    coupling:
      - [0.15, 0.0]
      - [0.0, 0.0]

  - node_a: flu
    node_b: body_aches
    coupling:
      - [0.2, 0.0]
      - [0.0, 0.0]

  # Tonsillitis → symptoms
  - node_a: tonsillitis
    node_b: temperature
    coupling:
      - [0.004, 0.0]
      - [0.0, 0.0]

  - node_a: tonsillitis
    node_b: sore_throat
    coupling:
      - [0.25, 0.0]
      - [0.0, 0.0]

  - node_a: tonsillitis
    node_b: headache
    coupling:
      - [0.05, 0.0]
      - [0.0, 0.0]

  # Disease competition
  - node_a: flu
    node_b: tonsillitis
    coupling:
      - [-0.05, 0.0]
      - [0.0, 0.0]

instruments:
  - name: thermometre
    node: temperature
    model:
      type: gaussian_noise
      noise_var: 0.04

  - name: questionnaire_cephalee
    node: headache
    model:
      type: beta_obs
      kappa: 20.0

  - name: questionnaire_gorge
    node: sore_throat
    model:
      type: beta_obs
      kappa: 20.0

  - name: questionnaire_courbatures
    node: body_aches
    model:
      type: beta_obs
      kappa: 20.0

observations:
  # Patient presents with:
  # - High fever: 39.2°C (measured with thermometer, low noise)
  - instrument: thermometre
    value: 39.2

  # - Sore throat: yes
  - instrument: questionnaire_gorge
    value: 0.999

  # - Headache: yes
  - instrument: questionnaire_cephalee
    value: 0.999

  # - Body aches: NO — this is the key differentiator!
  - instrument: questionnaire_courbatures
    value: 0.001

inference:
  max_iter: 500
  tolerance: 1.0e-10
  delta_t: 0.0
