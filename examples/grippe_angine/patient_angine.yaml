# Run: cargo run -- infer -i examples/grippe_angine/nodes.yaml -i examples/grippe_angine/edges.yaml -i examples/grippe_angine/instruments.yaml -i examples/grippe_angine/patient_angine.yaml
#
# Patient 2: Classic tonsillitis presentation
#
# Moderate fever, severe sore throat, NO headache, NO body aches.
# Expected: tonsillitis >> flu

observations:
  # Moderate fever: 38.5°C
  - instrument: thermometre
    value: 38.5

  # Headache: no
  - instrument: questionnaire_cephalee
    value: false

  # Sore throat: yes — the dominant symptom
  - instrument: questionnaire_gorge
    value: true

  # Body aches: no
  - instrument: questionnaire_courbatures
    value: false

inference:
  max_iter: 500
  tolerance: 1.0e-10
  delta_t: 0.0
