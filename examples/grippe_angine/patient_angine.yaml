# Run: cargo run -- infer -i examples/grippe_angine/nodes.yaml -i examples/grippe_angine/edges.yaml -i examples/grippe_angine/patient_angine.yaml
#
# Patient 2: Classic tonsillitis presentation
#
# Moderate fever, severe sore throat, NO headache, NO body aches.
# Expected: tonsillitis >> flu

observations:
  # Moderate fever: 38.5°C
  - type: gaussian_noise
    node: temperature
    value: 38.5
    noise_var: 0.04

  # Headache: no
  - type: bernoulli_exact
    node: headache
    value: false

  # Sore throat: yes — the dominant symptom
  - type: bernoulli_exact
    node: sore_throat
    value: true

  # Body aches: no
  - type: bernoulli_exact
    node: body_aches
    value: false

inference:
  max_iter: 500
  tolerance: 1.0e-10
  delta_t: 0.0
