# Patient 2: Classic tonsillitis presentation
#
# Moderate fever, severe sore throat, NO headache, NO body aches.
# Expected: tonsillitis >> flu

observations:
  # Moderate fever: 38.5°C
  - type: gaussian_noise
    node: 0
    value: 38.5
    noise_var: 0.04

  # Headache: no
  - type: bernoulli_exact
    node: 1
    value: false

  # Sore throat: yes — the dominant symptom
  - type: bernoulli_exact
    node: 2
    value: true

  # Body aches: no
  - type: bernoulli_exact
    node: 3
    value: false

inference:
  max_iter: 500
  tolerance: 1.0e-10
  delta_t: 0.0
