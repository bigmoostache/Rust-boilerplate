# Grippe vs. Angine — symptom↔symptom edges
#
# NOTE: disease↔symptom edges are declared in nodes.yaml.
# Only symptom↔symptom co-occurrence edges go here.
#
# temperature↔headache: fever and headache co-occur regardless
# of cause. Coupling is small because E[x] for temperature is
# large (~37), so even b_11=0.005 produces a meaningful contribution.
# Do NOT duplicate edges already declared via coupled_with.

edges:
  - node_a: temperature
    node_b: headache
    coupling:
      - [0.005, 0.0]
      - [0.0,   0.0]