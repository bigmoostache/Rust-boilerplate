# Patient 1: Classic flu presentation
#
# High fever, headache, body aches, NO sore throat.
# Expected: flu >> tonsillitis

observations:
  # High fever: 39.5°C
  - type: gaussian_noise
    node: 0
    value: 39.5
    noise_var: 0.04

  # Headache: yes
  - type: bernoulli_exact
    node: 1
    value: true

  # Sore throat: no
  - type: bernoulli_exact
    node: 2
    value: false

  # Body aches: yes — classic flu symptom
  - type: bernoulli_exact
    node: 3
    value: true

inference:
  max_iter: 500
  tolerance: 1.0e-10
  delta_t: 0.0
