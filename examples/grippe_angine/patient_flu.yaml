# Run: cargo run -- infer -i examples/grippe_angine/nodes.yaml -i examples/grippe_angine/edges.yaml -i examples/grippe_angine/patient_flu.yaml
#
# Patient 1: Classic flu presentation
#
# High fever, headache, body aches, NO sore throat.
# Expected: flu >> tonsillitis

observations:
  # High fever: 39.5°C
  - type: gaussian_noise
    node: temperature
    value: 39.5
    noise_var: 0.04

  # Headache: yes
  - type: bernoulli_exact
    node: headache
    value: true
    count: 10

  # Sore throat: no
  - type: bernoulli_exact
    node: sore_throat
    value: false
    count: 10

  # Body aches: yes — classic flu symptom
  - type: bernoulli_exact
    node: body_aches
    value: true
    count: 10

inference:
  max_iter: 500
  tolerance: 1.0e-10
  delta_t: 0.0
