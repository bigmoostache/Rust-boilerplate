# Run: cargo run -- infer -i examples/grippe_angine/nodes.yaml -i examples/grippe_angine/edges.yaml -i examples/grippe_angine/instruments.yaml -i examples/grippe_angine/patient_flu.yaml
#
# Patient 1: Classic flu presentation
#
# High fever, headache, body aches, NO sore throat.
# Expected: flu >> tonsillitis

observations:
  # High fever: 39.5°C
  - instrument: thermometre
    value: 39.5

  # Headache: yes
  - instrument: questionnaire_cephalee
    value: true

  # Sore throat: no
  - instrument: questionnaire_gorge
    value: false

  # Body aches: yes — classic flu symptom
  - instrument: questionnaire_courbatures
    value: true

inference:
  max_iter: 500
  tolerance: 1.0e-10
  delta_t: 0.0
