# Grippe vs. Angine — instrument definitions
#
# kappa interpretation:
#   kappa=100 : quasi-certain (PCR, lab test)
#   kappa=50  : reliable clinical instrument
#   kappa=20  : moderate (patient self-report, examined)
#   kappa=5   : weak signal
#
# For Beta nodes, the observation η_obs is:
#   η1_obs = kappa × value - 1
#   η2_obs = kappa × (1 - value) - 1
# so kappa is the effective pseudo-count added.

instruments:

  - name: thermometre
    node: temperature
    model:
      type: gaussian_noise
      noise_var: 0.04   # σ=0.2°C — typical clinical thermometer

  - name: questionnaire_cephalee
    node: headache
    model:
      type: beta_obs
      kappa: 50.0       # reliable symptom report

  - name: questionnaire_gorge
    node: sore_throat
    model:
      type: beta_obs
      kappa: 50.0

  - name: questionnaire_courbatures
    node: body_aches
    model:
      type: beta_obs
      kappa: 50.0