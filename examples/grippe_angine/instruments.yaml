# Grippe vs. Angine — instrument definitions
#
# Each instrument defines how a latent variable is measured:
# the target node, the measurement model, and noise parameters.
#
# Observations reference instruments by name and provide only
# the measured value.

instruments:
  # -- Temperature measurement --
  - name: thermometre
    node: temperature
    model:
      type: gaussian_noise
      noise_var: 0.04

  # -- Symptom questionnaire instruments --
  # Each binary symptom has its own conjugate Bernoulli instrument.
  # epsilon = symmetric error rate of the questionnaire.
  # epsilon = 0 means the patient's answer is perfectly reliable.

  - name: questionnaire_cephalee
    node: headache
    model:
      type: bernoulli_obs
      epsilon: 0.0

  - name: questionnaire_gorge
    node: sore_throat
    model:
      type: bernoulli_obs
      epsilon: 0.0

  - name: questionnaire_courbatures
    node: body_aches
    model:
      type: bernoulli_obs
      epsilon: 0.0
