# Grippe vs. Angine — instrument definitions
#
# Each instrument defines how a latent variable is measured:
# the target node, the measurement model, and noise parameters.
#
# Observations reference instruments by name and provide only
# the measured value.

instruments:
  # -- Temperature measurement --
  - name: thermometre
    node: temperature
    model:
      type: gaussian_noise
      noise_var: 0.04

  # -- Symptom questionnaire instruments --
  # Each binary symptom has its own noisy channel instrument.
  # ε is the probability of observing the wrong value.

  - name: questionnaire_cephalee
    node: headache
    model:
      type: noisy_channel
      epsilon: 0.05

  - name: questionnaire_gorge
    node: sore_throat
    model:
      type: noisy_channel
      epsilon: 0.05

  - name: questionnaire_courbatures
    node: body_aches
    model:
      type: noisy_channel
      epsilon: 0.05
