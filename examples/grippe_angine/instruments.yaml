# Grippe vs. Angine — instrument definitions
#
# Each instrument defines how a latent variable is measured:
# the target node, the measurement model, and noise parameters.
#
# Observations reference instruments by name and provide only
# the measured value.
#
# Binary symptoms use Beta-conjugate instruments (beta_obs).
# kappa = pseudo-count of the observation:
#   - kappa=100 → very reliable test (like a PCR)
#   - kappa=10  → moderately reliable (clinical exam)
#   - kappa=2   → weak signal (patient self-report)

instruments:
  # -- Temperature measurement --
  - name: thermometre
    node: temperature
    model:
      type: gaussian_noise
      noise_var: 0.04

  # -- Symptom questionnaire instruments --
  # Each binary symptom uses a Beta-conjugate instrument.
  # kappa controls the pseudo-count (reliability) of the observation.
  # Higher kappa → more weight relative to prior.

  - name: questionnaire_cephalee
    node: headache
    model:
      type: beta_obs
      kappa: 20.0

  - name: questionnaire_gorge
    node: sore_throat
    model:
      type: beta_obs
      kappa: 20.0

  - name: questionnaire_courbatures
    node: body_aches
    model:
      type: beta_obs
      kappa: 20.0
